<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Catalyst Operations Test</title>
<meta name="robots" content="noindex">
<meta name="description" content="Marking sheet for the Catalyst music studio operations test.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ops Test">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=JSON.parse(localStorage.getItem('ops.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141824" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column. Roster → one student's test sheet, stage by stage, like walking down a channel strip. */
:root{
  --bg:#eceff5; --panel:#ffffff; --sunk:#f4f6fa; --ink:#10131c; --mute:#5a6276; --line:#d5dae5;
  --led:#0b43e0; --led-soft:#0b43e01a;
  --tape:#f1e6bf; --tape-ink:#24221c;
  --ok:#0f7a57; --hint:#a35f00; --no:#bf2b2b;
  --ok-soft:#0f7a571c; --hint-soft:#a35f001f; --no-soft:#bf2b2b1a; --late:#c2410c; --late-soft:#c2410c1c;
  --display:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d13; --panel:#141824; --sunk:#10131c; --ink:#e7eaf2; --mute:#8b93a8; --line:#262c3b;
  --led:#5c8dff; --led-soft:#5c8dff22; --tape:#d8cda4; --tape-ink:#1b1a16;
  --ok:#36c98f; --hint:#f0a43a; --no:#ff6b6b; --ok-soft:#36c98f22; --hint-soft:#f0a43a22; --no-soft:#ff6b6b22; --late:#fb8a4c; --late-soft:#fb8a4c22;
  color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0b0d13; --panel:#141824; --sunk:#10131c; --ink:#e7eaf2; --mute:#8b93a8; --line:#262c3b;
  --led:#5c8dff; --led-soft:#5c8dff22; --tape:#d8cda4; --tape-ink:#1b1a16;
  --ok:#36c98f; --hint:#f0a43a; --no:#ff6b6b; --ok-soft:#36c98f22; --hint-soft:#f0a43a22; --no-soft:#ff6b6b22; --late:#fb8a4c; --late-soft:#fb8a4c22;
  color-scheme:dark}

*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px 0}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;min-height:48px;padding-bottom:8px}
.bar-l{display:flex;align-items:center;gap:8px;min-width:0;padding-right:10px}
.bar-r{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.brand{align-items:center;justify-content:center;text-align:center}
.brand .ttl{font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.015em;white-space:nowrap}
.who{position:relative;min-width:0}
.whobtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 4px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;font:inherit;font-weight:700;font-size:14px;max-width:100%}
.whobtn .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--led);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.whobtn .wn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whobtn svg{flex:none;color:var(--mute)}
.whobtn[aria-expanded="true"]{border-color:var(--led)}
@media (max-width:560px){.whobtn .wn{display:none}.whobtn{padding:0 8px 0 3px;gap:4px}
  .bar-l:has(#back) .whobtn svg{display:none}.bar-l:has(#back) .whobtn{padding:0 3px;width:42px;justify-content:center}}
.menu{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:min(290px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu-h{display:flex;flex-direction:column;padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-h b{font-size:16px}.menu-h span{font-size:12px;color:var(--mute)}
.menu-sec{display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;border-bottom:1px solid var(--line)}
.menu-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.menu-big{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-weight:700;font-size:14px}
.menu-big span{color:var(--mute);font-size:18px;line-height:1}
.menu-big:hover{border-color:var(--led)}
.menu-i{border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;font:inherit;font-weight:600;font-size:15px;color:var(--ink)}
.menu-i:hover{background:var(--sunk)}
.menu-i.danger{color:var(--no);border-top:1px solid var(--line);border-radius:0 0 9px 9px;margin-top:4px}
.brand b{text-wrap:balance}
.brand{display:flex;flex-direction:row;gap:16px;min-width:0;flex:1}
.brand .eyebrow{display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.brand b{font-weight:800}
@media (max-width:400px){.brand .ttl{font-size:17px}}
.menu-sync{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:8px 12px 8px 8px;font:inherit;text-align:left}
.ms-t{display:flex;flex-direction:column;min-width:0}.ms-t b{font-size:14px}.ms-t small{font-size:12px;color:var(--mute)}
.whobtn .av{position:relative}

.sync{flex:none;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;cursor:pointer;color:var(--ok);background:color-mix(in srgb,currentColor 14%,transparent);box-shadow:0 0 10px -2px currentColor;transition:color .25s,background .25s}
.sync svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sync[data-c="wait"],.sync[data-c="spin"]{color:var(--hint)}
.sync[data-c="spin"] svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.sync[data-c="spin"] svg{animation-duration:3s}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.iconbtn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;height:38px;min-width:38px;padding:0 12px;font-weight:600;font-size:14px}

.datebox{display:flex;align-items:center;gap:2px;flex:none}
.datebox .step{border:1px solid var(--line);background:var(--sunk);height:38px;width:30px;border-radius:9px;font-family:var(--mono);font-size:15px;color:var(--mute)}
.datepill{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:38px;padding:0 10px;border:1px solid var(--led);background:var(--led-soft);border-radius:9px;color:var(--led);font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap;line-height:1.05}
.datepill small{font-size:9px;letter-spacing:.1em;font-weight:500;opacity:.8}
.datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{border:0;background:none;padding:4px 0;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.month svg{width:14px;height:14px;transition:transform .2s;color:var(--mute)}
.month[aria-expanded="true"] svg{transform:rotate(180deg)}
.todaybtn{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.dstrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:8px 0 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.dstrip::-webkit-scrollbar{display:none}
.dcell{flex:0 0 calc((100% - 36px)/7);scroll-snap-align:start;border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s,color .15s,transform .15s}
.dcell:active{transform:scale(.96)}
.dcell .w{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dcell .n{font-size:19px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.dcell .c{height:14px;min-width:14px;padding:0 4px;border-radius:7px;font-family:var(--mono);font-size:9.5px;font-weight:700;line-height:14px;text-align:center;color:transparent}
.dcell[data-n] .c{background:var(--led-soft);color:var(--led)}
.dcell.we{background:transparent}
.dcell.today{border-color:var(--led);border-width:1.5px}
.dcell[aria-pressed="true"]{background:var(--led);color:#fff;border-color:var(--led);box-shadow:0 4px 14px -4px var(--led)}
.dcell[aria-pressed="true"] .w{color:#ffffffc0}
.dcell[aria-pressed="true"] .c{background:#ffffff33;color:#fff}
.dcell[aria-pressed="true"]:not([data-n]) .c{background:transparent}
.dcell.mstart .w{color:var(--led);font-weight:700}
.dcell[aria-pressed="true"].mstart .w{color:#fff}
.datecard{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:40px;border-radius:12px;background:var(--led);color:#fff;line-height:1.05}
.datecard small{font-family:var(--mono);font-size:9px;letter-spacing:.1em;opacity:.85}
.datecard b{font-size:18px;font-weight:800}
.datecard span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.datepill.static{border-color:var(--line);background:var(--sunk);color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:0 2px}
.dayhead b{font-size:14px}.dayhead span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.crit-n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--no)}
.chip .c{opacity:.6;margin-left:6px}
.banner{margin-top:12px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--mute)}

/* roster */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.stat .n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1}
.stat .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:16px;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who span{font-size:12px;color:var(--mute)}
.meter{width:44px;height:44px;flex:none}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap;border:1px solid currentColor}
.pill.pass{color:var(--ok);background:var(--ok-soft)} .pill.border{color:var(--hint);background:var(--hint-soft)} .pill.resit{color:var(--no);background:var(--no-soft)}
.pill.live{color:var(--led);background:var(--led-soft)} .pill.todo{color:var(--mute)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--mute)}
.empty b{color:var(--ink);display:block;margin-bottom:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.add{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--mute);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:16px}
textarea{resize:vertical;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:10px 6px;font-weight:600;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.primary{background:var(--led);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.danger{color:var(--no)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
details.guide{margin-top:20px}
details.notes{margin:14px 0 4px;border-top:1px solid var(--line);padding-top:10px}
details.notes summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:4px 0}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"+";font-family:var(--mono);color:var(--mute);width:12px}
details.notes[open] summary::before{content:"–"}
details.notes summary span{font-weight:400;font-size:12px;color:var(--mute)}
details.notes textarea{margin-top:8px;width:100%}
details.guide summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.guide summary::after{content:"+";font-family:var(--mono);color:var(--mute)}
details.guide[open] summary::after{content:"–"}
.guide ul{padding-left:18px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.key{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;color:#fff}

/* student sheet */
.strip{margin-top:14px;display:flex;align-items:center;gap:12px}
.scribble{background:var(--tape);color:var(--tape-ink);font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:8px 14px 7px;border-radius:2px;transform:rotate(-1deg);box-shadow:0 1px 0 #0000001f;font-size:18px;min-width:0;overflow-wrap:anywhere;line-height:1.3;max-width:100%;
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 3px,#000 calc(100% - 3px),transparent 100%)}
.strip .meta{font-size:12px;color:var(--mute);min-width:0}
.stagenav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,57px));z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.stagenav a{flex:none;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
.stagenav a .mono{color:var(--mute)}
.stagenav a .dot{width:6px;height:6px}
.stagenav a[data-s="done"] .dot{background:var(--ok)}
.stagenav a[data-s="part"] .dot{background:var(--hint)}
.stagenav a[data-s="flag"] .dot{background:var(--no)}
.sheet{display:flex;flex-direction:column;gap:22px;margin-top:16px;padding-bottom:40px}
.readout{font-size:12px;color:var(--mute);margin-top:10px}
.stage{display:flex;flex-direction:column;gap:8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.stage-h{display:flex;align-items:baseline;gap:10px;padding:0 2px}
.stage-h .mono{font-size:12px;color:var(--led);font-weight:700}
.stage-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1}
.stage-h .count{font-family:var(--mono);font-size:12px;color:var(--mute)}
.crit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.crit[data-m="y"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.crit[data-m="p"]{border-color:var(--ok);box-shadow:0 0 0 1.5px var(--ok),0 0 18px -4px var(--ok)}
.crit[data-m="h"]{border-color:color-mix(in srgb,var(--hint) 45%,var(--line))}
.crit[data-m="n"]{border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.crit[data-m="g"]{border-color:color-mix(in srgb,var(--late) 45%,var(--line))}
.crit-top{display:flex;gap:10px;align-items:flex-start}
.crit-top .t{flex:1;min-width:0}
.crit-top h3{font-size:15px;font-weight:700;line-height:1.3}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tags:empty{display:none}
.tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:1px 5px;border:1px solid var(--line);color:var(--mute)}
.tag.core{color:var(--led);border-color:var(--led)}
.tag.safety{color:var(--no);border-color:var(--no)}
.more{border:0;background:none;color:var(--mute);font-family:var(--mono);font-size:12px;padding:2px 0 2px 8px;flex:none}
.detail{font-size:13.5px;color:var(--mute);display:flex;flex-direction:column;gap:8px}
.detail .ask{color:var(--ink);background:var(--sunk);border-left:3px solid var(--led);padding:8px 10px;border-radius:0 8px 8px 0}
.detail .ask::before{content:"ASK  ";font-family:var(--mono);font-size:10px;font-weight:700;color:var(--led);letter-spacing:.1em}
/* a skill left unmarked when the teacher tried to save */
.crit.missing{border-color:var(--hint);box-shadow:0 0 0 2px var(--hint-soft);animation:missing 1.2s ease 2}
.crit.missing h3::after{content:"Not marked";display:inline-block;margin-left:8px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);border:1px solid var(--hint);border-radius:4px;padding:0 5px;vertical-align:2px}
@keyframes missing{50%{box-shadow:0 0 0 6px var(--hint-soft)}}
@media (prefers-reduced-motion:reduce){.crit.missing{animation:none}}
.marks{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.marks.swipe{display:block}
.marks.swipe>button{display:none}
/* Swipe marking: one horizontal fader. The cap follows the finger freely and glides to the nearest mark on release.
   Not marked: the cap rests dim in the middle and the readout says so. Double-tap clears. The panel never changes size. */
.sw{--p:#3ddc84;--y:#a6d84a;--h:#f2c53d;--g:#fb8a4c;--n:#ff5a5a;--c:#4a4f59;--x:50;position:relative;height:88px;border-radius:9px;
  background:linear-gradient(180deg,#30333b,#1a1c21);border:1px solid #0b0c0f;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.25);
  touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline-offset:3px}
.sw.drag{cursor:grabbing}
.sw[data-z="p"]{--c:var(--p)} .sw[data-z="y"]{--c:var(--y)} .sw[data-z="h"]{--c:var(--h)} .sw[data-z="g"]{--c:var(--g)} .sw[data-z="n"]{--c:var(--n)}
.sw-lcd{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:7px;height:20px;min-width:128px;padding:0 8px;border-radius:4px;background:#07090a;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.06);
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#5d636e;transition:color .12s}
.sw-lcd i{flex:none;width:6px;height:6px;border-radius:50%;background:#2c3038;transition:background .12s,box-shadow .12s}
.sw-lcd em{font-style:normal;margin-left:auto;padding-left:8px}
.sw:not([data-z=""]) .sw-lcd{color:var(--c)}
.sw:not([data-z=""]) .sw-lcd i{background:var(--c);box-shadow:0 0 7px var(--c)}
.sw-tip{position:absolute;right:11px;top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#7d838f;opacity:0;transition:opacity .2s;pointer-events:none}
.sw:not([data-v=""]):not(.drag) .sw-tip{opacity:1}
.sw-slot{position:absolute;left:6%;right:6%;top:43px;height:8px;border-radius:4px;background:#050607;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.08);pointer-events:none}
.sw-slot::after{content:"";position:absolute;left:4.5%;right:4.5%;top:13px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--p),var(--y) 25%,var(--h) 50%,var(--g) 75%,var(--n));opacity:.4}
.sw-scale{position:absolute;inset:0;pointer-events:none}
.sw-scale i{position:absolute;bottom:7px;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;color:#757b87;text-transform:uppercase;white-space:nowrap;transition:color .12s}
.sw-scale i[data-v="p"]{--k:var(--p)} .sw-scale i[data-v="y"]{--k:var(--y)} .sw-scale i[data-v="h"]{--k:var(--h)} .sw-scale i[data-v="g"]{--k:var(--g)} .sw-scale i[data-v="n"]{--k:var(--n)}
.sw-scale i.on{color:var(--k)}
.sw-car{position:absolute;inset:0;pointer-events:none;transform:translate3d(calc(var(--x) * 1%),0,0);transition:transform .24s cubic-bezier(.2,.8,.3,1);will-change:transform}
.sw.drag .sw-car{transition:none}
.sw.drag.glide .sw-car{transition:transform .12s cubic-bezier(.2,.8,.3,1)}
.sw-land{position:absolute;top:56px;left:calc(var(--z,50) * 1%);width:15%;height:3px;border-radius:2px;transform:translateX(-50%);background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;pointer-events:none;transition:left .18s cubic-bezier(.2,.8,.3,1),opacity .15s,background .12s}
.sw:not([data-z=""]) .sw-land{opacity:1}
.sw-cap{position:absolute;top:47px;left:0;width:30px;height:38px;transform:translate(-50%,-50%);border-radius:4px;pointer-events:none;border:1px solid #0b0c0f;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 4px),linear-gradient(90deg,#8f959e,#e8eaee 28%,#fbfbfc 50%,#d6d9de 72%,#878d96);
  box-shadow:0 5px 10px rgba(0,0,0,.55),inset 0 1px 0 #fff;transition:opacity .18s,filter .18s,box-shadow .15s}
.sw-cap::before{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:3px;transform:translateX(-50%);border-radius:2px;background:var(--c);box-shadow:0 0 4px var(--c);transition:background .12s}
.sw.drag .sw-cap{box-shadow:0 9px 16px rgba(0,0,0,.6),inset 0 1px 0 #fff}
.sw[data-v=""]:not(.drag) .sw-cap{opacity:.42;filter:grayscale(1)}
@media (max-width:380px){.sw-scale i{font-size:7.5px;letter-spacing:.03em}.sw-tip{display:none}}

<div class="toast" id="toast" hidden></div>

<script>
/* ------------------------------------------------------------------ rubric
   The test is edited in the Sheet's Questions tab; the back end sends it with every refresh. The lists below are
   only the first version: used before the first load and in the preview without a back end.
   ask:'…'             a question shown on the sheet for the teacher to ask out loud
   studios:['K3']      only for students booked in those studios (leave it out for everyone)
   Each teacher has their own questions tab: a student is asked their teacher's set (QLIVE, '' = shared), and a date
   that has been marked keeps the set it was first marked with for that teacher (QSETS, keyed date|teacher). */
const STAGES=[
 {id:'power',short:'Power',name:'Power up & safe listening'},
 {id:'mic',short:'Mic',name:'Connecting a Mic'},
 {id:'route',short:'Route',name:'Route to the speakers'},
 {id:'rec',short:'Record',name:'Record & play back in Pro Tools'},
 {id:'cue',short:'Cue',name:'Headphones & cue mix'},
 {id:'down',short:'Shut down',name:'Shut down & pack down'}
];
const CRIT=[
 {id:'p1',s:'power',core:1,t:'Powers up in the right order',look:'Desk, interface, outboard and computer first. Speakers (or their amp) switched on last.'},
 {id:'p2',s:'power',core:1,safety:1,t:'Control-room level down/mute before any console connections',look:'Watch this the whole test, not just at the start. Every speaker on/off and every big routing change happens with the control-room level down.'},
 {id:'p3',s:'power',t:'Keeps listening levels safe and works methodically',look:'No pressing random buttons with the level up. Brings level up slowly once signal is confirmed on the meters.'},
 {id:'m1',s:'mic',t:'Chooses the correct mic and places it sensibly',look:'Picks a dynamic (not the condenser or ribbon), uses a proper XLR, mic on a stand pointing at the source.'},
 {id:'m2',s:'mic',t:'Connects the live-room wall box to the right desk channel',look:'Knows which tie line lands on which desk input. Can say the number before plugging in.'},
 {id:'m3',s:'mic',core:1,t:'Gets a healthy signal on the desk',look:'Gain set at the preamp, not with the fader. Solid level on the meter, no clip light, no pad or HPF left on by accident.'},
 {id:'m4',s:'mic',core:1,safety:1,t:'Understands phantom power',ask:'If I had asked you to use the condenser instead, what would you have needed to do?',look:'+48V on that channel only. Faders and control-room level down when switching it. Wait for it to settle. Off before unplugging. Never on a ribbon.'},
 {id:'r1',s:'route',core:1,t:'Routes the channel to the console and hears it in the speakers',look:'Channel assigned to the mix bus, mix bus selected as the monitor source, right speakers selected, level brought up gently.'},
 {id:'t1',s:'rec',core:1,t:'Creates a Pro Tools track with the correct input and output',look:'Mono audio track, input matches the desk send / interface channel, output to the right interface output.'},
 {id:'t2',s:'rec',t:'Healthy record level in Pro Tools',look:'Peaks well short of clipping (roughly −18 to −10 dBFS). Fixes level at the preamp, not with the Pro Tools fader, and knows the fader does not change the recorded level.'},
 {id:'t3',s:'rec',core:1,t:'Records a 1-2-3 test and returns it on a different desk channel',look:'Track armed, records a short clip, playback arrives on the channel you asked for.'},
 {id:'t4',s:'rec',core:1,t:'Plays it back through the path you asked for',look:'Picks the right source (tape return or direct signal) on the right fader (long or short).'},
 {id:'c1',s:'cue',core:1,t:'Builds a usable cue mix on the aux sends',look:'Sends from the right channels, a balance a performer could play to, not just one channel blasting.'},
 {id:'c2',s:'cue',core:1,t:'Understands pre-fader vs. post-fader',ask:'Should this send be pre or post fader, and why?',look:'Pre-fader for headphones, so control-room fader moves do not change the performer\'s mix. Post-fader for effects sends.'},
 {id:'c3',s:'cue',core:1,t:'Routes the cue to the headphone amp and checks it',look:'Aux out reaches the headphone amp, right input selected on the amp, puts on headphones (level down first) to confirm.'},
 {id:'c4',s:'cue',t:'Explains sending the cue to a selected Live room',ask:'Without going there: how would the same cue reach this Live room?',look:'Names the patch points or tie lines for that room, says what they would check there (headphone amp on, level, which input).'},
 {id:'s1',s:'down',core:1,safety:1,t:'Knows the shutdown order',ask:'If you had to shut down the studio now, what would you switch off first?',look:'Control-room level down, then speakers off first. Then outboard and desk, computer last after saving and quitting Pro Tools.'},
 {id:'s2',s:'down',t:'Leaves the studio as it was found',look:'Patch cables out, phantom off, sends and EQ back to zero, faders down, mic and cables put away, session saved and closed.'}
];
// the questions in use: {id,stage,heading,t,ask,core,studios} as the back end sends them, plus s = a stage key for the page
const DEFAULT_Q=CRIT.map(c=>{const st=STAGES.find(x=>x.id===c.s);return {id:c.id,stage:st.short,heading:st.name,t:c.t,ask:c.ask||'',core:c.core?1:0,studios:c.studios||null}});
function setQuestions(now,live,sets){QNOW=qset(now);QLIVE={};QSETS={};for(const [k,l] of Object.entries(live||{}))QLIVE[k]=qset(l);for(const [k,l] of Object.entries(sets||{}))QSETS[k]=qset(l)}
function qset(list){const keys=[];return (list||[]).map(q=>{let i=keys.indexOf(q.stage);if(i<0){keys.push(q.stage);i=keys.length-1}return {...q,s:'g'+i}})}
let QNOW=qset(DEFAULT_Q),QLIVE={},QSETS={};   // replaced by the last questions this phone saw, then by every refresh
const STUDIOS=['K3','K4'];
// marks, best first; tolerant on purpose: "Got there" on everything still passes
const MARK={p:'Perfect',y:'Pass',h:'Hint',g:'Got there',n:'Failed'};
const POINTS={p:1,y:.8,h:.65,g:.5,n:0};
const QUICK=['Speakers switched with level up','Phantom switched with fader up','Control-room level dangerously loud while patching'];
// the score is the share of all the teacher's questions, each worth the same, as a percentage;
// Grade A from 85, Pass from 40; any critical error is a Resit whatever the score
const GRADES=[{k:'merit',l:'Grade A',min:.85,col:'ok'},{k:'passg',l:'Qualified',min:.4,col:'ink'},{k:'resitg',l:'Resit',min:0,col:'no'}];

/* ------------------------------------------------------------------ helpers */
const $=s=>document.querySelector(s);
const touchDevice=matchMedia('(pointer: coarse)').matches;
/* iPhone home-screen apps: a tap on a field that is already focused (but has no keyboard) does nothing.
   Blur and refocus inside the tap so the keyboard always comes up. */
document.addEventListener('touchend',e=>{
  const f=e.target.closest&&e.target.closest('input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],textarea');
  if(f&&document.activeElement===f){f.blur();f.focus()}
},{passive:true});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDay=d=>{try{return new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}catch(e){return d}};
const hhmm=ms=>new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function merge(a,b){const o={...(a||{})};for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?merge(o[k],b[k]):b[k]}return o}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ------------------------------------------------------------------ state */
// the back end address comes from config.js (or ?api=… while testing); without one the page runs as a preview
const API=new URLSearchParams(location.search).get('api')||window.OPS_API||'';

/* ---- each teacher marks on their own: a student keeps one entry per teacher under by.<teacher name>.
   Until a date is revealed the back end sends other teachers' entries only as {_progress: skills marked}. */
function entries(t){const e={};for(const [k,v] of Object.entries(t.by||{}))if(v)e[k]=v;return e}
const mine=t=>!S.me?{}:entries(t)[S.me]||{};

const tkey=t=>String(t&&t.teacher||'').trim().toLowerCase().replace(/\s+/g,' ');
const skillsFor=t=>(QSETS[t.day+'|'+tkey(t)]||QLIVE[tkey(t)]||QLIVE['']||QNOW).filter(c=>!c.studios||c.studios.includes(t.studio));
// the stages of one student's questions, in order
const stagesFor=t=>{const out=[];for(const c of skillsFor(t))if(!out.some(x=>x.id===c.s))out.push({id:c.s,short:c.stage,name:c.heading||c.stage});return out};
const bandOf=p=>GRADES.find(g=>p>=g.min*100-1e-9);
// one teacher's own progress and score; shown next to the combined result, never used for it
function scoreOf(e,t){
  const skills=t?skillsFor(t):QNOW,m=e.marks||{};let pts=0,n=0;
  for(const c of skills){const v=m[c.id];if(v in POINTS){n++;pts+=POINTS[v]}}
  const inc=[...new Set(Object.values(e.safety||{}).filter(Boolean).map(i=>i.text))];
  return {pct:n?pts/n:0,n,total:skills.length,left:skills.length-n,complete:n===skills.length,inc};
}
/* The combined grade is the same sum for every student and every teacher:
   1. each skill's mark is the average of every teacher's mark on it
   2. the score is the average over all skills, so every skill weighs the same
   3. any critical error that any teacher logged means Resit
   (every question counts the same; there are no core skills any more) */
function gradeOf(t){
  const skills=skillsFor(t),es=entries(t),uids=Object.keys(es);
  const per=skills.map(c=>{const v=uids.map(u=>es[u].marks?.[c.id]).filter(x=>x in POINTS).map(x=>POINTS[x]);return {c,n:v.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});
  const marked=per.filter(x=>x.avg!==null);
  const score=marked.length?marked.reduce((a,x)=>a+x.avg,0)/marked.length*100:0;
  const errors=[...new Set(uids.flatMap(u=>Object.values(es[u].safety||{}).filter(Boolean).map(i=>i.text)))];
  const deduction=0,final=score;
  const coreFails=[];
  const grade=errors.length?GRADES[GRADES.length-1]:bandOf(final);
  return {skills,per,marked:marked.length,total:skills.length,complete:marked.length===skills.length,score,errors,deduction,final,coreFails,grade,teachers:uids.filter(u=>Object.values(es[u].marks||{}).some(v=>v in POINTS))};
}

    const r=await fetch(API,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,...body}),signal:ctl.signal});
    const j=await r.json();

}

/* The script's slower housekeeping (IDs for pasted rows, Marks columns, the Grades tab) runs in its own call after

   the last save), and the sync button stays orange until that is done: green means the Grades tab is up to date too. */

  tidyAt=Date.now();S.tidying=true;S.tidyWanted=false;paintSync();

function applyState(j){

  for(const e of j.entries)if(tests[e.sid])tests[e.sid].by[e.teacher]=e.data||{_progress:e.progress||0};
  S.tests=tests;
  S.teachers=Object.fromEntries(j.teachers.map(n=>[n,{name:n}]));

    setQuestions(j.questions,j.qlive||{},j.qsets||{});

/* Where the app opens: today if students are booked today, otherwise the next test day (so before the test and between

function startDay(){

const isTransfer=t=>/^transfer/i.test(capOf(t));
const capTag=t=>capOf(t)?`<span class="cap${isTransfer(t)?' xfer':''}" title="${isTransfer(t)?'Transfer: from outside the class':'CAP class'}">${esc(capOf(t))}</span>`:'';

/* ------------------------------------------------------------------ write queue
   Every tap is kept on this phone at once (it survives a reload or a flat battery). The Sheet hears about it at the
   landmarks: End test and grade, leaving a student, the phone going off screen, or after 90 quiet seconds.
   Everything waiting goes in one call. Date, time and teacher changes are sent straight away. */
function view(id){return S.pending[id]?merge(S.tests[id],S.pending[id]):S.tests[id]}
// changes this teacher still has to send (unsaved marks left on the phone by someone else are not theirs to send)
const myPending=()=>Object.keys(S.pending).filter(id=>{const p=S.pending[id];return p&&(p.day||p.time!==undefined||p.teacher!==undefined||(p.by&&p.by[S.me]))});
function allTests(){return Object.keys(S.tests).map(id=>({id,...view(id)})).filter(t=>t.name&&!t.deleted)}
function patch(id,obj){
  S.pending[id]=merge(S.pending[id],obj);ls.set('ops.pending',S.pending);
  refresh();flushSoon(obj.by?QUIET_MS:400);if(!flushing&&S.sync!=='err')setSync('local');
}
const QUIET_MS=90000;
const patchMine=(id,obj)=>{if(!canMark())return;patch(id,{by:{[S.me]:obj}})};
let flushT=null,flushAt=0,flushing=false,backoff=1000,wseq=0;
// never pushes a send that is already due sooner further away
function flushSoon(d=400){const at=Date.now()+d;if(flushT&&flushAt<=at)return;clearTimeout(flushT);flushAt=at;flushT=setTimeout(()=>{flushT=null;flush()},d)}
async function flush(){
  if(flushing)return;const ids=myPending();if(!ids.length){setSync('ok');return}
  if(S.demo){for(const id of ids){S.tests[id]=merge(S.tests[id],S.pending[id])}S.pending={};ls.set('ops.pending',{});setSync('ok');refresh();return}
  flushing=true;setSync('busy');
  // everything waiting, in one call: [[action, body, student id], ...]
  const sent={},steps=[];
  for(const id of ids){
    const p=S.pending[id];if(!p)continue;sent[id]=p;
    if(p.day||p.time!==undefined||p.teacher!==undefined)steps.push(['updateStudent',{id,day:p.day,time:p.time,teacher:p.teacher},id]);
    const m=p.by&&p.by[S.me];if(m)steps.push(['saveEntry',{sid:id,patch:m},id]);   // only this teacher's part; the rest stays for its owner
  }
  const j=await api('batch',{steps:steps.map(([a,b])=>[a,b])});
  if(!j.ok){flushing=false;
    if(j.net||j.code==='busy'){setSync('err');flushSoon(backoff=Math.min(backoff*2,20000));return}
    toast(j.error||'Those changes could not be saved.');setSync('err');return}
  const bad={};(j.results||[]).forEach((r,i)=>{if(r&&!r.ok){bad[steps[i][2]]=1;toast(r.error||'That change could not be saved.')}});   // refused (e.g. the student was removed): dropped, and said why
  wseq++;
  for(const [id,p] of Object.entries(sent)){
    const m=p.by&&p.by[S.me],other=p.by?Object.fromEntries(Object.entries(p.by).filter(([k])=>k!==S.me)):{};
    if(!bad[id])S.tests[id]=merge(S.tests[id],{...p,by:{[S.me]:m||{}}});
    if(S.pending[id]===p){if(Object.keys(other).length)S.pending[id]={by:other};else delete S.pending[id]}
    // tapped again while this was on its way: only the newer part is still waiting
    else if(S.pending[id]&&m&&S.pending[id].by&&S.pending[id].by[S.me]){const d=diff(S.pending[id].by[S.me],m);if(Object.keys(d).length)S.pending[id].by[S.me]=d;else delete S.pending[id].by[S.me]}
  }
  ls.set('ops.pending',S.pending);
  backoff=1000;flushing=false;
  if(steps.length)tidy(true);   // let the Sheet bring Marks and Grades up to date with what was just saved
  if(myPending().length){setSync('local');flushSoon(QUIET_MS)}else setSync('ok');

}

/* ------------------------------------------------------------------ updates
   GitHub Pages lets phones keep an old copy of this page for 10 minutes (longer in a home-screen app).
   When the app opens or comes back on screen it asks for the newest page, and if that is a newer BUILD
   it reloads into it, unless marks are still waiting to be sent. BUILD is stamped on every publish. */
const BUILD='1793532677';
let updAt=0;
async function checkUpdate(){
  if(S.demo||Date.now()-updAt<60000)return;updAt=Date.now();
  try{
    const r=await fetch(location.pathname+'?b='+Date.now(),{cache:'no-store'});const txt=await r.text();
    const m=txt.match(new RegExp('^const BUI'+'LD=\'([^\']+)\';$','m'));if(!m||m[1]===BUILD)return;   // (the pattern is split so the publish stamp never rewrites this line)
    if(myPending().length){flushSoon(10);return}
    const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.toString());
  }catch(e){}
}

const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');

  const sel=new Date(S.day+'T12:00'),mon=new Date(sel);mon.setDate(sel.getDate()-((sel.getDay()+6)%7));
  const start=new Date(mon);start.setDate(mon.getDate()-14);

function bindWhoMenu(){
  const b=$('#whoBtn'),m=$('#whoMenu');if(!b||!m)return;
  const show=on=>{m.hidden=!on;b.setAttribute('aria-expanded',on);if(on){document.addEventListener('pointerdown',away,true);document.addEventListener('keydown',esc_)}else{document.removeEventListener('pointerdown',away,true);document.removeEventListener('keydown',esc_)}};
  const away=e=>{if(!e.target.closest('.who'))show(false)},esc_=e=>{if(e.key==='Escape'){show(false);b.focus()}};
  b.onclick=()=>show(m.hidden);
  m.onclick=e=>{if(e.target.closest('#menuSync')){syncNow();return}   // the menu stays open, so the sync is seen happening
    const th=e.target.closest('[data-theme-pick]');
    if(th){setTheme(th.dataset.themePick);m.querySelectorAll('[data-theme-pick]').forEach(x=>x.setAttribute('aria-pressed',x===th));return}
    const st=e.target.closest('[data-style]');
    if(st){S.style=st.dataset.style;m.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x===st));
      if(S.view==='test')renderSheet();toast(st.dataset.style==='swipe'?'Scale marking on':'Button marking on');return}
    const gv=e.target.closest('[data-go]');if(gv){show(false);go(gv.dataset.go);return}
    if(e.target.closest('#menuOut')){show(false);signOut()}};
}
function go(v,id){if(S.view==='test'&&v!=='test')flushSoon(0);   // leaving a student is a landmark: send what is waiting

  if(v==='questions'&&S.view!=='questions'){Q.dirty=false;Q.list=null}
  S.view=v;S.open=id||null;renderBar();render();scrollTo(0,0);wake(v==='test')}

function refresh(){if(S.view==='test'){const raw=view(S.open);if(raw&&!raw.deleted&&sheetSig({id:S.open,...raw})!==S.sheetSig)renderSheet();else syncSheet()}else if(S.view==='roster')render();else if(S.view==='account')renderAccount(true);else if(S.view==='questions'||S.view==='add'){}else if(S.view==='grades')loadGrades().then(()=>{if(S.view==='grades')renderGrades()})}

/* A progress bar that never claims more than it knows: it creeps towards 92 % and the words change with the wait,
   so a slow Google Sheet reads as "working", never as "stuck". stop(true) fills it. */
function progress(el,signIn){
  const q=signIn==='q';if(q)signIn=false;
  const steps=(signIn?[[0,'Signing you in','Checking the team password with the Google Sheet.']]:[])
    .concat([[signIn?2.5:0,q?'Getting your questions':'Getting your students',q?'Straight from your questions tab in the Sheet.':'Students, questions and your marks, straight from the Sheet.'],
      [7,'Almost there','Google Sheets can take a few seconds to wake up. Nothing is lost.'],
      [15,'Still working','A slow connection or a sleepy Sheet. It is safe to wait: keep this page open.'],
      [35,'Taking longer than usual','Still trying. Marks already on this phone stay on this phone.']]);
  el.innerHTML=`<div class="prog"><div class="prog-bar"><i></i></div><div class="prog-row"><b class="prog-t"></b><span class="prog-n"></span></div><span class="prog-s"></span></div>`;
  el.setAttribute('role','status');el.setAttribute('aria-live','polite');
  const t0=Date.now(),bar=el.querySelector('i');let last=-1;
  const tick=()=>{if(!el.isConnected){clearInterval(h);return}const t=(Date.now()-t0)/1000;bar.style.width=(92*(1-Math.exp(-t/4))).toFixed(1)+'%';
    let k=0;steps.forEach((st,i)=>{if(t>=st[0])k=i});
    if(k!==last){last=k;el.querySelector('.prog-t').textContent=steps[k][1];el.querySelector('.prog-s').textContent=steps[k][2]}
    el.querySelector('.prog-n').textContent=t>=3?Math.floor(t)+' s':''};
  tick();const h=setInterval(tick,250);
  return ok=>{clearInterval(h);if(ok){bar.style.width='100%';el.querySelector('.prog-t').textContent='Ready';el.querySelector('.prog-s').textContent='';el.querySelector('.prog-n').textContent=''}};
}
/* ------------------------------------------------------------------ questions editor
   A teacher edits their own questions tab here (an admin: anyone's, or the shared tab). Nothing is sent until Save;
   Save sends the whole list in stage order. The Sheet refuses it if the tab was changed there in the meantime. */
const Q={who:null,list:null,dirty:false,busy:false,err:'',seq:0};
async function loadQuestions(who){
  Q.loading=true;Q.list=null;Q.err='';renderQuestions();
  const j=S.demo?{ok:false,error:'Not in the preview.'}:await api('myQuestions',who==null?{}:{teacher:who});
  Q.loading=false;if(S.view!=='questions')return;
  if(!j.ok){Q.err=j.error||'Could not load the questions.';renderQuestions();return}
  takeQuestions(j);renderQuestions();
}
function takeQuestions(j){
  Q.who=j.teacher;Q.tab=j.tab;Q.v=j.v;Q.teachers=j.teachers;Q.stages=j.stages.slice();Q.dirty=false;Q.err='';
  j.questions.forEach(q=>{if(!Q.stages.includes(q.stage))Q.stages.push(q.stage)});
  Q.head={};j.questions.forEach(q=>{if(q.heading&&!Q.head[q.stage])Q.head[q.stage]=q.heading});
  Q.list=j.questions.map(q=>({...q,k:++Q.seq}));
}

/* ---- the sheet: built once per open, then synced in place so typing is never interrupted */
function markBtns(kind,id,opts){
  // Swipe marking (a choice in the teacher menu, kept on this phone) shows a green-to-red bar instead of the buttons.
  // The buttons stay underneath and the bar only ever picks one of the same five marks, so what is saved never changes.
  const sw=kind==='crit'&&opts.length===5&&markStyle()==='swipe';
  return `<div class="marks${opts.length===3?' three':''}${sw?' swipe':''}" data-${kind}="${id}">${opts.map(v=>`<button type="button" data-v="${v}" aria-pressed="false"><i></i>${MARK[v]}</button>`).join('')}${sw?swipeBar():''}</div>`}
const SWIPE=['p','y','h','g','n'],SW_AT=[10,30,50,70,90];   // left (green) to right (red), as % along the panel
function swipeBar(){return `<div class="sw" role="slider" tabindex="0" aria-label="Mark. Double-tap clears" aria-valuemin="0" aria-valuemax="4" aria-valuetext="Not marked" data-v="" data-z="" style="--x:50">
  <span class="sw-lcd" aria-hidden="true"><i></i><b>NOT MARKED</b><em></em></span><span class="sw-tip" aria-hidden="true">double-tap to clear</span>
  <span class="sw-slot"></span><span class="sw-scale" aria-hidden="true">${SWIPE.map((v,i)=>`<i data-v="${v}" style="left:${SW_AT[i]}%">${MARK[v]}</i>`).join('')}</span><span class="sw-land"></span><span class="sw-car"><span class="sw-cap"></span></span></div>`}

function swipePaint(bar,z,x){bar.style.setProperty('--x',x.toFixed(2));if(bar.dataset.z===z)return;bar.dataset.z=z;
  if(z)bar.style.setProperty('--z',SW_AT[SWIPE.indexOf(z)]);   // the marker under the scale: where it will land
  bar.querySelector('.sw-lcd b').textContent=z?MARK[z].toUpperCase():'NOT MARKED';bar.querySelector('.sw-lcd em').textContent=z?Math.round(POINTS[z]*100):'';
  bar.querySelectorAll('.sw-scale i').forEach(i=>i.classList.toggle('on',i.dataset.v===z))}
/* The knob stays exactly where it was let go; the mark is the zone it rests in (five equal zones).
   That spot is remembered on this phone only, so the saved mark stays one of the same five. */
const swPos=ls.get('ops.swpos',{}),swKey=(id)=>S.open+'|'+id;
const zoneAt=x=>SWIPE[Math.max(0,Math.min(4,Math.round((x-10)/20)))];
// shows a saved mark (or none: the cap rests dim in the middle); left alone while a finger is on it
function swipeShow(g,v){const bar=g.querySelector('.sw');if(!bar||bar.classList.contains('drag'))return;const i=SWIPE.indexOf(v);
  const kept=swPos[swKey(g.dataset.crit)],x=i<0?50:kept!=null&&zoneAt(kept)===v?kept:SW_AT[i];

function bindSwipe(app,commit){

    const zoneOf=zoneAt;
    const keep=x=>{if(x==null)delete swPos[swKey(id)];else swPos[swKey(id)]=Math.round(x*10)/10;ls.set('ops.swpos',swPos)};
    const set=(v,x)=>{keep(v?x:null);bar.dataset.v=v||'';swipeShow(g,v);commit(id,v)};

       once it moves sideways; a mostly vertical move is left to the page, which scrolls. */
    let raf=0,gt=0;

/* ---- per-student timer: 10 minutes down, then over time (+m:ss) and still counting. Kept on this phone. */
const TIMER_SECS=600;

    const n=el.querySelector('.tm-num');if(n)n.textContent=v?v.txt:'10:00';
    const l=el.querySelector('.tm-label');if(l)l.textContent=!v?'Timer':v.over?'Over time':'Time left'});

// two soft bell notes, under a second: noticed in a quiet studio, never startling
function chime(){try{if(!actx)return;if(actx.state==='suspended')actx.resume();const t0=actx.currentTime+.03;
  for(const [f,dt] of [[1046.5,0],[784,.24]])for(const [mul,amp] of [[1,.14],[2,.025]]){
    const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f*mul;
    g.gain.setValueAtTime(0,t0+dt);g.gain.linearRampToValueAtTime(amp,t0+dt+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.9);
    o.connect(g);g.connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+.95)}}catch(e){}}
setInterval(tick,1000);

/* keep the phone awake while a test sheet is open */
let lock=null;async function wake(on){try{if(on&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener?.('release',()=>lock=null)}else if(!on&&lock){await lock.release();lock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.view==='test')wake(true)});

// one fixed screen: no pinch, no double-tap and no ctrl-wheel zoom
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(e.key))e.preventDefault()});
boot();
